<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gupta Sports</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main { padding: 32px; }
      .mark {
        margin: 0;
        font-size: clamp(6rem, 22vw, 12rem);
        line-height: .72;
        letter-spacing: -.16em;
        transform: translateX(-.08em);
      }
      .name {
        margin: 28px 0 0;
        font-family: Arial, sans-serif;
        font-size: clamp(1rem, 3vw, 1.6rem);
        font-weight: 700;
        letter-spacing: .42em;
        text-transform: uppercase;
      }
      .details {
        margin: 28px 0 0;
        color: #c7c7c7;
        font-family: Arial, sans-serif;
        font-size: .95rem;
        letter-spacing: .08em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark" aria-label="GS">GS</p>
      <p class="name">Gupta Sports.</p>
      <p class="details">Jersey · Shoes · All Sportswear<br />169, Sarojini Nagar Market.</p>
    </main>
  </body>
</html>
